<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Smart English Grade 1 - 16 Units, Reading Stories, Sentence Patterns & 44 IPA Sounds</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Quicksand & Nunito -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Quicksand:wght@600;700;800&display=swap" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --primary: #FF6584;
      --secondary: #10B981;
      --accent: #F59E0B;
      --blue: #3B82F6;
      --purple: #8B5CF6;
      --dark: #1E293B;
    }
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      font-family: 'Nunito', 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #FFE4E6 0%, #E0F2FE 50%, #EDE9FE 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 6px;
      color: var(--dark);
    }
    .font-cute {
      font-family: 'Quicksand', cursive, sans-serif;
    }
    #app-container {
      background: rgba(255, 255, 255, 0.98);
      width: 100%;
      max-width: 1200px;
      min-height: 700px;
      max-height: 96vh;
      border-radius: 28px;
      box-shadow: 0 20px 50px rgba(244, 114, 182, 0.2);
      border: 4px solid #FFF;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }
    .card-hover {
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .card-hover:hover {
      transform: translateY(-3px) scale(1.015);
    }
    .btn-bounce:active {
      transform: scale(0.96);
    }
    .choice-ipa {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-style: normal !important;
      font-weight: 700 !important;
      font-size: 17px;
      letter-spacing: 0.5px;
    }
    .letter-btn {
      width: 48px;
      height: 48px;
      font-size: 24px;
      font-weight: 900;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
      transition: all 0.2s;
    }
    .slot-word-btn {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 6px 12px;
      border-radius: 14px;
      min-width: 70px;
      transition: all 0.2s;
    }
    .vocab-pill-red {
      background-color: #FFE4E6;
      color: #E11D48;
      font-weight: 900;
      padding: 1px 8px;
      border-radius: 8px;
      display: inline-block;
      margin: 0 2px;
      border: 1px solid #FECDD3;
    }
    .pos-badge {
      font-size: 11px;
      font-weight: 900;
      padding: 2px 8px;
      border-radius: 9999px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .pos-noun { background-color: #E0E7FF; color: #4338CA; border: 1.5px solid #C7D2FE; }
    .pos-verb { background-color: #DCFCE7; color: #15803D; border: 1.5px solid #BBF7D0; }
    .pos-adj  { background-color: #FEF3C7; color: #B45309; border: 1.5px solid #FDE68A; }
    .pos-adv  { background-color: #FCE7F3; color: #BE185D; border: 1.5px solid #FBCFE8; }
    .pos-prep { background-color: #F3E8FF; color: #7E22CE; border: 1.5px solid #E9D5FF; }
    .custom-scrollbar::-webkit-scrollbar {
      width: 5px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background-color: #FBCFE8;
      border-radius: 9999px;
    }
    .reading-q-card {
      background: #FFFFFF;
      border: 2px solid #F1F5F9;
      border-radius: 14px;
      padding: 8px 10px;
      transition: all 0.2s;
    }
    .missing-char-blank {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 36px;
      height: 48px;
      border-bottom: 4px solid #F43F5E;
      margin: 0 3px;
      font-size: 32px;
      font-weight: 900;
      color: #E11D48;
    }
    .missing-char-filled {
      border-bottom: 4px solid #10B981;
      color: #059669;
      animation: bounce-in 0.4s ease;
    }
    @keyframes bounce-in {
      0% { transform: scale(0.5); opacity: 0; }
      70% { transform: scale(1.2); }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <div id="app-container">

    <!-- 0. WELCOME OVERLAY SCREEN -->
    <div id="start-overlay" class="absolute inset-0 bg-gradient-to-br from-pink-500/95 via-rose-400/95 to-purple-600/95 z-50 flex flex-col items-center justify-center p-6 text-center text-white">
      <div class="w-20 h-20 bg-white rounded-3xl flex items-center justify-center text-5xl shadow-2xl mb-3 transform -rotate-6 animate-bounce">
        🐰
      </div>
      
      <div id="greeting-badge" class="bg-white/20 backdrop-blur-md px-5 py-1.5 rounded-full text-base md:text-lg font-black tracking-wide border border-white/40 mb-2.5 shadow-sm">
        🌅 Good morning, little princess!
      </div>

      <h1 class="text-2xl md:text-3xl font-black font-cute mb-2">🌸 ENGLISH GRADE 1 LEARNING PARK 🌸</h1>
      <p class="text-sm md:text-base font-bold max-w-lg mb-5 leading-relaxed text-pink-100">
        Explore 12 Learning Sections, 16 Unit Topics (70 words), 44 IPA Sounds, Sentence Patterns, Numbers & 20 Reading Stories! ✨
      </p>
      
      <button id="btn-start-app" onclick="initAppAudio()" class="btn-bounce bg-amber-300 hover:bg-amber-200 text-amber-900 text-lg md:text-xl font-black px-8 py-3.5 rounded-full shadow-2xl border-4 border-white transition flex items-center space-x-2.5 cursor-pointer">
        <span>🔊 START LEARNING NOW</span>
      </button>
    </div>

    <!-- HEADER: INTERACTIVE BREADCRUMB TABS + MAIN TITLE + STARS -->
    <header class="bg-white/95 backdrop-blur-md px-3 py-2 flex justify-between items-center border-b-2 border-pink-100 z-10 gap-2">
      <div id="nav-breadcrumb-container" class="flex items-center space-x-1.5 flex-shrink-0 flex-wrap">
      </div>

      <div class="flex items-center justify-center flex-1">
        <h1 class="text-xs sm:text-base md:text-lg font-black font-cute text-pink-600 tracking-wide drop-shadow-sm flex items-center gap-1.5 cursor-pointer line-clamp-1" onclick="openEngMenu()">
          <span>🌍</span>
          <span class="bg-gradient-to-r from-pink-600 via-purple-600 to-indigo-600 bg-clip-text text-transparent">ENGLISH GRADE 1</span>
          <span>🌍</span>
        </h1>
      </div>

      <div class="flex items-center space-x-2 flex-shrink-0">
        <div class="flex items-center space-x-1.5 bg-amber-50 border-2 border-amber-300 px-3 py-0.5 rounded-xl shadow-inner">
          <span class="text-lg animate-spin" style="animation-duration: 4s;">⭐</span>
          <span id="stars-count" class="text-xl font-black text-amber-600">0</span>
          <span class="text-[11px] font-black text-amber-500 hidden sm:inline">Stars</span>
        </div>
        <button onclick="speakMascotCheer()" class="btn-bounce bg-pink-100 hover:bg-pink-200 text-pink-600 border border-pink-300 px-2.5 py-1 rounded-xl text-xs font-black flex items-center space-x-1 shadow-sm cursor-pointer">
          <span>🐰 Cheer</span>
        </button>
      </div>
    </header>

    <!-- MAIN CONTENT VIEWPORT -->
    <main id="main-content" class="flex-1 p-3 md:p-4 flex flex-col items-center justify-center text-center overflow-y-auto custom-scrollbar">
      <!-- Dynamic View Rendering -->
    </main>

  </div>

  <script>
    let stars = parseInt(localStorage.getItem('stars_eng_lop1') || '0');
    let currentMode = null;
    let currentAnswer = null;
    let currentFullSentence = null;
    let currentVocabTarget = null;
    let currentTopicId = null;
    let audioCtx = null;
    let cachedVoices = [];

    function refreshVoiceList() {
      if ('speechSynthesis' in window) {
        cachedVoices = window.speechSynthesis.getVoices() || [];
      }
    }
    if ('speechSynthesis' in window) {
      refreshVoiceList();
      window.speechSynthesis.onvoiceschanged = refreshVoiceList;
    }

    function pickBestVoice(langPrefix) {
      if (!cachedVoices || cachedVoices.length === 0) refreshVoiceList();
      const candidates = cachedVoices.filter(v => v.lang && v.lang.toLowerCase().startsWith(langPrefix));
      if (candidates.length === 0) return null;
      const femaleHints = ['female', 'nữ', 'woman', 'hoaimy', 'linh', 'mai', 'an', 'zira', 'susan', 'samantha', 'google'];
      const preferred = candidates.find(v => femaleHints.some(hint => v.name.toLowerCase().includes(hint)));
      return preferred || candidates[0];
    }

    document.getElementById('stars-count').innerText = stars;

    /* =========================================================================
       1. AUDIO ENGINE & TTS SYSTEM
       ========================================================================= */
    function getTimeBasedGreeting() {
      const hour = new Date().getHours();
      if (hour >= 5 && hour < 12) {
        return { en: "Good morning! How are you today?", vi: "Chào buổi sáng bé yêu!", badge: "🌅 Good morning, little princess!" };
      } else if (hour >= 12 && hour < 18) {
        return { en: "Good afternoon! Ready to learn English?", vi: "Chào buổi chiều bé yêu!", badge: "☀️ Good afternoon, little princess!" };
      } else {
        return { en: "Good evening! Let's have fun with English!", vi: "Chào buổi tối bé yêu!", badge: "🌙 Good evening, little princess!" };
      }
    }

    const currentGreeting = getTimeBasedGreeting();
    const greetingBadgeElem = document.getElementById('greeting-badge');
    if (greetingBadgeElem) greetingBadgeElem.innerText = currentGreeting.badge;

    function initAppAudio() {
      const overlay = document.getElementById('start-overlay');
      if (overlay) overlay.style.display = 'none';
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext && !audioCtx) audioCtx = new AudioContext();
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        playTone('correct');
      } catch (e) {}
      try {
        const greeting = getTimeBasedGreeting();
        speakClear(`${greeting.en} Welcome to English Grade 1!`, "en");
      } catch (e) {}
      openEngMenu();
    }

    function playTone(type) {
      try {
        if (!audioCtx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) audioCtx = new AudioContext();
        }
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        if (!audioCtx) return;

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'correct') {
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.15);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.35);
          osc.start(now);
          osc.stop(now + 0.35);
        } else {
          osc.frequency.setValueAtTime(260, now);
          osc.frequency.linearRampToValueAtTime(180, now + 0.22);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
          osc.start(now);
          osc.stop(now + 0.25);
        }
      } catch (e) {}
    }

    function speakClear(text, lang = 'en', onEndCallback = null) {
      try {
        if (!('speechSynthesis' in window)) {
          if (typeof onEndCallback === 'function') onEndCallback();
          return;
        }
        window.speechSynthesis.cancel();

        const cleanText = String(text || '').trim();
        if (!cleanText) {
          if (typeof onEndCallback === 'function') onEndCallback();
          return;
        }

        const targetLangPrefix = (lang === 'vi' || lang === 'vi-VN') ? 'vi' : 'en';
        const utterance = new SpeechSynthesisUtterance(cleanText);
        utterance.lang = targetLangPrefix === 'vi' ? 'vi-VN' : 'en-US';

        const voice = pickBestVoice(targetLangPrefix);
        if (voice) utterance.voice = voice;

        utterance.rate = 0.88;
        utterance.pitch = 1.12;
        utterance.onend = () => {
          if (typeof onEndCallback === 'function') onEndCallback();
        };
        utterance.onerror = () => {
          if (typeof onEndCallback === 'function') onEndCallback();
        };

        // Some browsers need voices loaded asynchronously before first speak.
        if (!voice && cachedVoices.length === 0) {
          setTimeout(() => {
            const retryVoice = pickBestVoice(targetLangPrefix);
            if (retryVoice) utterance.voice = retryVoice;
            window.speechSynthesis.speak(utterance);
          }, 150);
        } else {
          window.speechSynthesis.speak(utterance);
        }
      } catch (err) {
        if (typeof onEndCallback === 'function') onEndCallback();
      }
    }

    function speakMascotCheer() {
      const cheers = [
        "Wonderful! You are doing an amazing job!",
        "Keep it up! Every correct answer gives you a shining star!",
        "Great job learning English Grade 1 today!",
        "Excellent! You are so smart and hardworking!"
      ];
      speakClear(cheers[Math.floor(Math.random() * cheers.length)], "en");
    }

    function addStars(num, showConfetti = true) {
      if (num <= 0) return;
      stars += num;
      localStorage.setItem('stars_eng_lop1', stars);
      const starDisp = document.getElementById('stars-count');
      if (starDisp) starDisp.innerText = stars;
      if (showConfetti && typeof confetti === 'function') {
        confetti({ particleCount: 50, spread: 70, origin: { y: 0.75 } });
      }
    }

    const HISTORY_SYSTEM = {};
    function getHistoryState(modeKey) {
      if (!HISTORY_SYSTEM[modeKey]) {
        HISTORY_SYSTEM[modeKey] = { items: [], index: -1 };
      }
      return HISTORY_SYSTEM[modeKey];
    }

    const QUEUE_SYSTEM = {};
    function getNextItemFromPool(poolKey, rawDataArray) {
      if (!QUEUE_SYSTEM[poolKey] || QUEUE_SYSTEM[poolKey].length === 0) {
        const shuffled = [...rawDataArray];
        for (let i = shuffled.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        QUEUE_SYSTEM[poolKey] = shuffled;
      }
      return QUEUE_SYSTEM[poolKey].pop();
    }

    /* =========================================================================
       BREADCRUMB / TAB HIERARCHY NAVIGATION SYSTEM
       ========================================================================= */
    function updateBreadcrumbs(crumbs = []) {
      const navContainer = document.getElementById('nav-breadcrumb-container');
      if (!navContainer) return;
      if (!crumbs || crumbs.length === 0) {
        navContainer.innerHTML = '';
        return;
      }

      const html = crumbs.map((crumb, idx) => {
        const isLast = idx === crumbs.length - 1;
        if (isLast) {
          return `
            <div class="flex items-center space-x-1">
              ${idx > 0 ? '<span class="text-pink-300 font-black text-xs">/</span>' : ''}
              <span class="text-xs font-black bg-pink-500 text-white border-2 border-pink-600 px-3 py-1 rounded-xl shadow-sm">
                ${crumb.label}
              </span>
            </div>
          `;
        } else {
          return `
            <div class="flex items-center space-x-1">
              ${idx > 0 ? '<span class="text-pink-300 font-black text-xs">/</span>' : ''}
              <button onclick="${crumb.action}" class="btn-bounce bg-pink-50 hover:bg-pink-100 text-pink-700 border-2 border-pink-200 font-black px-2.5 py-1 rounded-xl text-xs flex items-center space-x-1 shadow-sm transition cursor-pointer">
                <span>${crumb.label}</span>
              </button>
            </div>
          `;
        }
      }).join('');

      navContainer.innerHTML = html;
    }

    /* =========================================================================
       2. ALPHABET & PHONICS (A-Z)
       ========================================================================= */
    const ALPHABET_PHONICS = [
      { letter: 'A', name: 'A a', ipaName: '/eɪ/', sound: '/æ/', word1: { en: 'Apple', ipa: '/ˈæp.əl/', vi: 'Quả táo', emoji: '🍎', pos: 'Noun', ex: 'An apple a day.' }, word2: { en: 'Ant', ipa: '/ænt/', vi: 'Con kiến', emoji: '🐜', pos: 'Noun', ex: 'A tiny ant.' }, word3: { en: 'Alligator', ipa: '/ˈæl.ɪ.ɡeɪ.tər/', vi: 'Cá sấu', emoji: '🐊', pos: 'Noun', ex: 'Green alligator.' } },
      { letter: 'B', name: 'B b', ipaName: '/biː/', sound: '/b/', word1: { en: 'Ball', ipa: '/bɔːl/', vi: 'Quả bóng', emoji: '⚽', pos: 'Noun', ex: 'Play with a ball.' }, word2: { en: 'Bear', ipa: '/beər/', vi: 'Con gấu', emoji: '🐻', pos: 'Noun', ex: 'A brown bear.' }, word3: { en: 'Book', ipa: '/bʊk/', vi: 'Quyển sách', emoji: '📖', pos: 'Noun', ex: 'Open your book.' } },
      { letter: 'C', name: 'C c', ipaName: '/siː/', sound: '/k/', word1: { en: 'Cat', ipa: '/kæt/', vi: 'Con mèo', emoji: '🐱', pos: 'Noun', ex: 'The cat sleeps.' }, word2: { en: 'Car', ipa: '/kɑːr/', vi: 'Xe ô tô', emoji: '🚗', pos: 'Noun', ex: 'A red fast car.' }, word3: { en: 'Cup', ipa: '/kʌp/', vi: 'Cái chén/cốc', emoji: '☕', pos: 'Noun', ex: 'A tea cup.' } },
      { letter: 'D', name: 'D d', ipaName: '/diː/', sound: '/d/', word1: { en: 'Dog', ipa: '/dɒɡ/', vi: 'Con chó', emoji: '🐶', pos: 'Noun', ex: 'The dog barks.' }, word2: { en: 'Duck', ipa: '/dʌk/', vi: 'Con vịt', emoji: '🦆', pos: 'Noun', ex: 'Yellow duck.' }, word3: { en: 'Door', ipa: '/dɔːr/', vi: 'Cửa ra vào', emoji: '🚪', pos: 'Noun', ex: 'Close the door.' } },
      { letter: 'E', name: 'E e', ipaName: '/iː/', sound: '/e/', word1: { en: 'Elephant', ipa: '/ˈel.ɪ.fənt/', vi: 'Con voi', emoji: '🐘', pos: 'Noun', ex: 'Big gray elephant.' }, word2: { en: 'Egg', ipa: '/eɡ/', vi: 'Quả trứng', emoji: '🥚', pos: 'Noun', ex: 'Eat an egg.' }, word3: { en: 'Eraser', ipa: '/ɪˈreɪ.zər/', vi: 'Cục tẩy', emoji: '🧼', pos: 'Noun', ex: 'Pick up your eraser.' } },
      { letter: 'F', name: 'F f', ipaName: '/ef/', sound: '/f/', word1: { en: 'Fish', ipa: '/fɪʃ/', vi: 'Con cá', emoji: '🐟', pos: 'Noun', ex: 'Fish swims fast.' }, word2: { en: 'Fox', ipa: '/fɒks/', vi: 'Con cáo', emoji: '🦊', pos: 'Noun', ex: 'An orange fox.' }, word3: { en: 'Frog', ipa: '/frɒɡ/', vi: 'Con ếch', emoji: '🐸', pos: 'Noun', ex: 'Green frog hops.' } },
      { letter: 'G', name: 'G g', ipaName: '/dʒiː/', sound: '/ɡ/', word1: { en: 'Giraffe', ipa: '/dʒɪˈrɑːf/', vi: 'Hươu cao cổ', emoji: '🦒', pos: 'Noun', ex: 'Giraffe has long neck.' }, word2: { en: 'Goat', ipa: '/ɡəʊt/', vi: 'Con dê', emoji: '🐐', pos: 'Noun', ex: 'A lovely goat.' }, word3: { en: 'Grape', ipa: '/ɡreɪp/', vi: 'Quả nho', emoji: '🍇', pos: 'Noun', ex: 'Sweet purple grape.' } },
      { letter: 'H', name: 'H h', ipaName: '/eɪtʃ/', sound: '/h/', word1: { en: 'Hat', ipa: '/hæt/', vi: 'Cái mũ', emoji: '👒', pos: 'Noun', ex: 'Wear yellow hat.' }, word2: { en: 'Horse', ipa: '/hɔːs/', vi: 'Con ngựa', emoji: '🐴', pos: 'Noun', ex: 'The horse runs.' }, word3: { en: 'Hand', ipa: '/hænd/', vi: 'Bàn tay', emoji: '✋', pos: 'Noun', ex: 'Hands up!' } },
      { letter: 'I', name: 'I i', ipaName: '/aɪ/', sound: '/ɪ/', word1: { en: 'Igloo', ipa: '/ˈɪɡ.luː/', vi: 'Lều tuyết', emoji: '🏔️', pos: 'Noun', ex: 'Cold ice igloo.' }, word2: { en: 'Ink', ipa: '/ɪŋk/', vi: 'Mực viết', emoji: '🖋️', pos: 'Noun', ex: 'Blue pen ink.' }, word3: { en: 'Insect', ipa: '/ˈɪn.sekt/', vi: 'Côn trùng', emoji: '🐞', pos: 'Noun', ex: 'Tiny insect.' } },

      let posClass = 'pos-noun';
      let posShort = 'Noun';

      else if (pos.toLowerCase().includes('adj')) { posClass = 'pos-adj'; posShort = 'Adj'; }
      else if (pos.toLowerCase().includes('adv')) { posClass = 'pos-adv'; posShort = 'Adv'; }
      else if (pos.toLowerCase().includes('prep')) { posClass = 'pos-prep'; posShort = 'Prep'; }

      return {
        topicId, word, pos: posShort, posClass, ipa, vi, emoji,
        examples: [

          { en: `This is a ${word.toLowerCase()}.`, vi: `Đây là một ${vi.toLowerCase()}.` }
        ]
      };

    function getIPA(word) {
      if (!word) return '';
      const found = ENG_VOCAB_MASTER.find(v => v.word.toLowerCase() === word.toLowerCase());
      if (found) return found.ipa;
      if (EXTRA_IPA[word] || EXTRA_IPA[word.toLowerCase()]) return EXTRA_IPA[word] || EXTRA_IPA[word.toLowerCase()];
      const clean = word.replace(/[^a-zA-Z]/g, '').toLowerCase();
      const fallback = ENG_VOCAB_MASTER.find(v => v.word.toLowerCase() === clean);
      return fallback ? fallback.ipa : (EXTRA_IPA[clean] || '');
    }

    function highlightWordInSentence(sentence, targetWord) {
      if (!sentence || !targetWord) return sentence;
      const regex = new RegExp(`\\b(${targetWord}[a-z]*)\\b`, 'gi');
      return sentence.replace(regex, `<span class="vocab-pill-red">$1</span>`);
    }

    function checkVocabChoice(btnElement, selectedWord) {
      speakClear(selectedWord, "en");
      const isCorrect = selectedWord === currentVocabQuizWord.word;

      if (isCorrect) {
        btnElement.classList.remove('border-pink-300', 'hover:border-pink-500', 'text-gray-800');
        btnElement.classList.add('!bg-emerald-500', '!text-white', '!border-emerald-600');
        playTone('correct');
        addStars(2, true);
        document.querySelectorAll('#vocab-choices-grid button').forEach(b => b.disabled = true);

        const answerBox = document.getElementById('vocab-answer-box');
        if (answerBox) {
          answerBox.className = "bg-sky-50 border-2 border-sky-300 text-sky-700 font-black text-base px-4 py-2 rounded-xl mb-2";
          answerBox.innerHTML = `${currentVocabQuizWord.word} <span class="choice-ipa text-sky-600">${currentVocabQuizWord.ipa}</span>`;
        }

        const examplesBox = document.getElementById('vocab-examples-box');

                  </span>
                  <span class="text-[10px] font-bold text-gray-400">Lấy từ 18 Chủ đề Lớp 2</span>

            <button onclick="openIPAMenu(${currentIPAIndex + 1})" class="btn-bounce bg-amber-400 hover:bg-amber-500 text-amber-900 border-2 border-amber-500 font-black text-sm px-6 py-2 rounded-xl shadow-md flex items-center space-x-1.5 cursor-pointer ${currentIPAIndex >= IPA_MASTER.length - 1 ? 'opacity-40 cursor-not-allowed' : ''}" ${currentIPAIndex >= IPA_MASTER.length - 1 ? 'disabled' : ''}>

    /* =========================================================================

    /* =========================================================================
       11. SECTION 3: REMOVE EXTRA LETTER
       ========================================================================= */
    let currentFixLetters = [];
    let currentExtraIndex = -1;

    function startEngSpellingFixerGame(targetWordObj = null, isNav = false) {
      currentMode = 'engSpellingFixer';
      updateBreadcrumbs([
        { label: '⬅️ Main Menu', action: 'openEngMenu()' },
        { label: '🧹 3. Remove Extra Letter', action: 'startEngSpellingFixerGame()' }
      ]);

      const historyState = getHistoryState('spellingFixer');
      let targetObj;
      if (targetWordObj) {
        targetObj = targetWordObj;
      } else if (historyState.index >= 0 && historyState.index < historyState.items.length - 1 && isNav) {
        historyState.index++;
        targetObj = historyState.items[historyState.index];
      } else {
        targetObj = getNextItemFromPool('pool_spelling_master', ENG_VOCAB_MASTER);
        historyState.items.push(targetObj);
        historyState.index = historyState.items.length - 1;
      }

      const cleanUpper = targetObj.word.toUpperCase().replace(/[^A-Z]/g, '');
      currentAnswer = cleanUpper;

      const alphabetChars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
      const poolChoices = alphabetChars.split('').filter(c => !cleanUpper.includes(c));
      const extraChar = poolChoices.length > 0 
        ? poolChoices[Math.floor(Math.random() * poolChoices.length)]
        : alphabetChars[Math.floor(Math.random() * alphabetChars.length)];

      currentFixLetters = cleanUpper.split('');
      const insertPos = Math.floor(Math.random() * (currentFixLetters.length + 1));
      currentFixLetters.splice(insertPos, 0, extraChar);
      currentExtraIndex = insertPos;

      const lettersHtml = currentFixLetters.map((l, idx) => `
        <button onclick="removeExtraLetter(${idx})" class="letter-btn btn-bounce bg-white border-2 border-rose-400 hover:bg-rose-50 text-rose-700 shadow-sm m-1 cursor-pointer">
          ${l}
        </button>
      `).join('');

      container.innerHTML = `
        <div class="text-base md:text-lg font-black text-gray-800 mb-2 flex items-center justify-center gap-2">
          <span>Click to remove the EXTRA letter:</span>
          <button class="btn-bounce bg-rose-100 hover:bg-rose-200 text-rose-700 text-xs font-bold px-2.5 py-1 rounded-lg flex items-center gap-1 shadow-sm cursor-pointer" onclick="speakClear('${targetObj.word}', 'en')">🔊 Listen</button>
        </div>
        <div class="bg-rose-50/50 border-2 border-dashed border-rose-200 rounded-2xl p-4 w-full max-w-lg mb-3 flex flex-col items-center">
          <div class="text-6xl mb-1.5">${targetObj.emoji}</div>
          <div class="text-base md:text-lg font-black text-gray-700 mb-0.5">Meaning: <b class="text-rose-600">${targetObj.vi}</b></div>
          <div class="choice-ipa text-lg md:text-xl text-rose-600 bg-rose-100/70 border border-rose-200 px-4 py-1 rounded-lg mb-2.5">${targetObj.ipa}</div>
          <div id="letters-box" class="flex flex-wrap justify-center gap-1 my-1.5">${lettersHtml}</div>
          <div id="fixer-feedback" class="text-sm font-black min-h-[22px] mt-1.5"></div>
        </div>
        <div class="flex items-center justify-center space-x-3">
          <button onclick="prevSpellingFixer()" class="btn-bounce bg-sky-50 hover:bg-sky-100 text-sky-600 border-2 border-sky-300 font-black text-sm px-5 py-2 rounded-xl shadow-sm flex items-center space-x-1.5 cursor-pointer ${historyState.index <= 0 ? 'opacity-40 cursor-not-allowed' : ''}" ${historyState.index <= 0 ? 'disabled' : ''}>
            <i class="fa-solid fa-arrow-left"></i>
            <span>Previous</span>
          </button>
          <button onclick="nextSpellingFixer()" class="btn-bounce bg-amber-400 hover:bg-amber-500 text-amber-900 border-2 border-amber-500 font-black text-sm px-6 py-2 rounded-xl shadow-md flex items-center space-x-1.5 cursor-pointer">
            <span>Next</span>
            <i class="fa-solid fa-arrow-right"></i>
          </button>
        </div>
      `;
      speakClear(targetObj.word, "en");
    }

    function removeExtraLetter(index) {
      const feedback = document.getElementById('fixer-feedback');
      if (index === currentExtraIndex) {
        currentFixLetters.splice(index, 1);
        playTone('correct');
        addStars(2, true);
        feedback.innerHTML = `<span class="text-green-600 text-base">🎉 Correct! Complete word: <b>${currentAnswer}</b> (+2 ⭐). Press Next when ready!</span>`;
        const lettersBox = document.getElementById('letters-box');
        if (lettersBox) {
          lettersBox.innerHTML = currentFixLetters.map(l => `
            <div class="letter-btn bg-green-500 text-white border-2 border-green-600 shadow-md m-1">${l}</div>
          `).join('');
        }
        speakClear(currentAnswer, "en");
      } else {
        playTone('wrong');
        feedback.innerHTML = `<span class="text-rose-600 text-sm">💡 This letter belongs to the word. Try another!</span>`;
      }
    }

    function prevSpellingFixer() {
      const historyState = getHistoryState('spellingFixer');
      if (historyState.index > 0) {
        historyState.index--;
        startEngSpellingFixerGame(historyState.items[historyState.index], true);
      }
    }

    function nextSpellingFixer() {
      const historyState = getHistoryState('spellingFixer');
      if (historyState.index < historyState.items.length - 1) {
        historyState.index++;
        startEngSpellingFixerGame(historyState.items[historyState.index], true);
      } else {
        startEngSpellingFixerGame(null, false);
      }
    }

    /* =========================================================================
       12. SECTION 4: FILL MISSING LETTER
       ========================================================================= */
    let currentMissingWordObj = null;
    let currentMissingCharIndex = -1;
    let currentMissingChar = '';

    function startEngMissingLetterGame(targetWordObj = null, isNav = false) {
      currentMode = 'engMissingLetter';
      updateBreadcrumbs([
        { label: '⬅️ Main Menu', action: 'openEngMenu()' },
        { label: '✍️ 4. Fill Missing Letter', action: 'startEngMissingLetterGame()' }
      ]);

      const historyState = getHistoryState('missingLetter');
      let targetObj;
      if (targetWordObj) {
        targetObj = targetWordObj;
      } else if (historyState.index >= 0 && historyState.index < historyState.items.length - 1 && isNav) {
        historyState.index++;
        targetObj = historyState.items[historyState.index];
      } else {
        targetObj = getNextItemFromPool('pool_missing_letter', ENG_VOCAB_MASTER);
        historyState.items.push(targetObj);
        historyState.index = historyState.items.length - 1;
      }

      currentMissingWordObj = targetObj;
      const cleanUpper = targetObj.word.toUpperCase().replace(/[^A-Z]/g, '');
      currentAnswer = cleanUpper;

      const hideIdx = Math.floor(Math.random() * cleanUpper.length);
      currentMissingCharIndex = hideIdx;
      currentMissingChar = cleanUpper[hideIdx];

      const alphabetChars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
      let letterChoices = [currentMissingChar];
      while (letterChoices.length < 4) {
        const randLetter = alphabetChars[Math.floor(Math.random() * alphabetChars.length)];
        if (!letterChoices.includes(randLetter)) {
          letterChoices.push(randLetter);
        }
      }
      letterChoices.sort(() => Math.random() - 0.5);

      const wordChars = cleanUpper.split('');
      const slotsHtml = wordChars.map((ch, idx) => {
        if (idx === hideIdx) {
          return `<span id="missing-slot" class="missing-char-blank">_</span>`;
        }
        return `<span class="inline-flex items-center justify-center min-w-[32px] h-12 text-3xl font-black text-gray-800">${ch}</span>`;
      }).join(' ');

      container.innerHTML = `
        <div class="text-base md:text-lg font-black text-gray-800 mb-2 flex items-center justify-center gap-2">
          <span>Choose 1 correct letter to fill the blank:</span>
          <button class="btn-bounce bg-amber-100 hover:bg-amber-200 text-amber-700 text-xs font-bold px-2.5 py-1 rounded-lg flex items-center gap-1 shadow-sm cursor-pointer" onclick="speakClear('${targetObj.word}', 'en')">🔊 Listen</button>

          <div id="missing-word-container" onclick="speakClear('${targetObj.word}', 'en')" class="card-hover bg-white border-2 border-amber-400 rounded-2xl px-6 py-2.5 shadow-md flex items-center justify-center tracking-widest cursor-pointer mb-2">
            ${slotsHtml}
          </div>

          <p class="text-[11px] font-bold text-gray-400">💡 Tap the card anytime to listen to the word sound!</p>
          <div id="missing-feedback" class="text-sm font-black min-h-[22px] mt-1"></div>
        </div>

        <div id="letter-choices-grid" class="grid grid-cols-4 gap-3 w-full max-w-md mb-3.5">
          ${letterChoices.map(letter => `
            <button onclick="checkMissingLetterChoice(this, '${letter}')" class="btn-bounce bg-white border-3 border-amber-400 hover:bg-amber-100 text-amber-900 font-black text-2xl py-3 rounded-2xl shadow-sm transition flex items-center justify-center cursor-pointer">
              ${letter}
            </button>

        <div class="flex items-center justify-center space-x-3">
          <button onclick="prevMissingLetter()" class="btn-bounce bg-sky-50 hover:bg-sky-100 text-sky-600 border-2 border-sky-300 font-black text-sm px-5 py-2 rounded-xl shadow-sm flex items-center space-x-1.5 cursor-pointer ${historyState.index <= 0 ? 'opacity-40 cursor-not-allowed' : ''}" ${historyState.index <= 0 ? 'disabled' : ''}>

            <i class="fa-solid fa-arrow-right"></i>

      const shuffledTopics = [...ENG_TOPICS].sort(() => Math.random() - 0.5);
      const mainTopic = shuffledTopics[0];
      const otherTopic = shuffledTopics[1];

      const mainWords = ENG_VOCAB_MASTER.filter(v => v.topicId === mainTopic.id);
      const otherWords = ENG_VOCAB_MASTER.filter(v => v.topicId === otherTopic.id);

      const shuffledMainWords = [...mainWords].sort(() => Math.random() - 0.5);
      const chosenThree = shuffledMainWords.slice(0, 3);

      const shuffledOtherWords = [...otherWords].sort(() => Math.random() - 0.5);
      const chosenOdd = shuffledOtherWords[0];

      const allFour = [...chosenThree, chosenOdd].sort(() => Math.random() - 0.5);

      return {
        mainTopic,
        otherTopic,
        chosenThree,
        oddWord: chosenOdd,
        options: allFour

    let currentReadingPassage = null;

        next = getNextItemFromPool('pool_readingPassage', READING_PASSAGES);
      }
      return next;
    }

                  <h3 class="font-black text-pink-700 text-sm md:text-base leading-tight">${passage.title}</h3>

    function toggleReadingTranslation() {
      const viBox = document.getElementById('reading-vi-box');
      if (viBox) {
        viBox.classList.toggle('hidden');
      }
    }

    function getEnglishVoicePair() {
      if (!cachedVoices || cachedVoices.length === 0) refreshVoiceList();
      const enVoices = cachedVoices.filter(v => v.lang && v.lang.toLowerCase().startsWith('en'));
      const maleHints = ['male', 'david', 'daniel', 'james', 'mark', 'alex', 'fred', 'george', 'guy', 'thomas'];
      const femaleHints = ['female', 'zira', 'susan', 'samantha', 'victoria', 'karen', 'moira', 'tessa', 'google'];
      let voiceA = enVoices.find(v => maleHints.some(h => v.name.toLowerCase().includes(h))) || enVoices[0] || null;
      let voiceB = enVoices.find(v => v !== voiceA && femaleHints.some(h => v.name.toLowerCase().includes(h)))
        || enVoices.find(v => v !== voiceA)
        || voiceA;
      return { voiceA, voiceB };
    }

    function speakSingleLine(text, spk, onEndCallback) {
      try {
        if (!('speechSynthesis' in window)) {
          if (typeof onEndCallback === 'function') onEndCallback();
          return;
        }
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        let voice = null;
        let pitch = 1.05;
        if (spk === 'A' || spk === 'B') {
          const pair = getEnglishVoicePair();
          voice = spk === 'A' ? pair.voiceA : pair.voiceB;
          pitch = spk === 'A' ? 0.92 : 1.28;
        } else {
          voice = pickBestVoice('en');
        }
        if (voice) utterance.voice = voice;
        utterance.rate = 0.9;
        utterance.pitch = pitch;
        utterance.onend = () => { if (typeof onEndCallback === 'function') onEndCallback(); };
        utterance.onerror = () => { if (typeof onEndCallback === 'function') onEndCallback(); };
        window.speechSynthesis.speak(utterance);
      } catch (err) {
        if (typeof onEndCallback === 'function') onEndCallback();
      }
    }

    function speakLinesSequentially(lines, idx) {
      if (!lines || idx >= lines.length) return;
      const line = lines[idx];
      const text = (typeof line === 'string') ? line : line.text;
      const spk = (typeof line === 'string') ? null : line.spk;
      speakSingleLine(text, spk, () => {
        setTimeout(() => speakLinesSequentially(lines, idx + 1), 420);
      });
    }

    function speakReadingFull() {
      if (!currentReadingPassage) return;
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      speakLinesSequentially(currentReadingPassage.lines, 0);
    }

    function selectReadingChoice(qIdx, cIdx) {
      currentReadingUserAnswers[qIdx] = cIdx;
      const passage = currentReadingPassage;
      const qObj = passage.questions[qIdx];

      qObj.choices.forEach((_, idx) => {
        const btn = document.getElementById(`rq-btn-${qIdx}-${idx}`);
        if (!btn) return;
        if (idx === cIdx) {
          btn.className = "btn-bounce w-full text-left bg-pink-500 text-white font-black py-1.5 px-2.5 rounded-xl text-xs md:text-sm flex items-center justify-between shadow-sm transition mb-1 border-2 border-pink-600 cursor-pointer";
        } else {
          btn.className = "btn-bounce w-full text-left bg-white border-2 border-pink-200 hover:border-pink-400 hover:bg-pink-50 text-gray-700 font-black py-1.5 px-2.5 rounded-xl text-xs md:text-sm flex items-center justify-between shadow-sm transition mb-1 cursor-pointer";

    function checkAllReadingAnswers() {
      const passage = currentReadingPassage;
      const feedback = document.getElementById('reading-feedback');
      let unanswered = 0;
      let correctCount = 0;

      currentReadingUserAnswers.forEach((ans) => {
        if (ans === -1) unanswered++;
      });

      if (unanswered > 0) {
        feedback.innerHTML = `<span class="text-rose-600 font-black">⚠️ Please answer all ${passage.questions.length} questions! (${unanswered} remaining)</span>`;
        playTone('wrong');
        return;
      }

      passage.questions.forEach((qObj, qIdx) => {
        const userChoice = currentReadingUserAnswers[qIdx];
        const correctChoice = qObj.ans;

        qObj.choices.forEach((_, cIdx) => {
          const btn = document.getElementById(`rq-btn-${qIdx}-${cIdx}`);
          const status = document.getElementById(`rq-status-${qIdx}-${cIdx}`);
          if (!btn) return;
          btn.disabled = true;

          if (cIdx === correctChoice) {
            btn.className = "w-full text-left bg-emerald-500 text-white font-black py-1.5 px-2.5 rounded-xl text-xs md:text-sm flex items-center justify-between shadow-sm transition mb-1 border-2 border-emerald-600";
            if (status) status.innerHTML = "✅";
          } else if (cIdx === userChoice && userChoice !== correctChoice) {
            btn.className = "w-full text-left bg-rose-500 text-white font-black py-1.5 px-2.5 rounded-xl text-xs md:text-sm flex items-center justify-between shadow-sm transition mb-1 border-2 border-rose-600";
            if (status) status.innerHTML = "❌";
          }
        });

        if (userChoice === correctChoice) correctCount++;
      });

      const total = passage.questions.length;
      if (correctCount === total) {
        playTone('correct');
        addStars(total, true);
        feedback.innerHTML = `<span class="text-green-600 text-sm md:text-base font-black">🎉 EXCELLENT! You answered ${total}/${total} questions correctly! (+${total} ⭐). Click Next to read the next story!</span>`;
        speakClear("Awesome! You answered all the questions correctly!", "en");
      } else {
        playTone('wrong');
        if (correctCount > 0) {
          addStars(correctCount, false);
        }
        feedback.innerHTML = `<span class="text-amber-700 text-xs md:text-sm font-black">You got ${correctCount}/${total} correct (+${correctCount} ⭐). Check the green answers carefully and press Next when ready!</span>`;
        speakClear(`Good try! You got ${correctCount} correct answers.`, "en");
      }
    }

      { sentence: "I can see ______ windows.", correct: "six", meaning: "Tôi thấy sáu cửa sổ.", emoji: "6️⃣", choices: ["six", "five", "seven", "nine"] },
      { sentence: "I can see ______ windows.", correct: "seven", meaning: "Tôi thấy bảy cửa sổ.", emoji: "7️⃣", choices: ["seven", "six", "eight", "ten"] },
      { sentence: "I can see ______ windows.", correct: "eight", meaning: "Tôi thấy tám cửa sổ.", emoji: "8️⃣", choices: ["eight", "seven", "nine", "six"] },
      { sentence: "I can see ______ windows.", correct: "nine", meaning: "Tôi thấy chín cửa sổ.", emoji: "9️⃣", choices: ["nine", "eight", "ten", "seven"] },
      { sentence: "I can see ______ windows.", correct: "ten", meaning: "Tôi thấy mười cửa sổ.", emoji: "🔟", choices: ["ten", "nine", "eight", "six"] },
      { sentence: "How many clocks? ______.", correct: "Two", meaning: "Có bao nhiêu cái đồng hồ? Hai cái.", emoji: "🕐", choices: ["Two", "Three", "Four", "One"] },
      { sentence: "How many windows can you see? I can see ______.", correct: "six", meaning: "Bạn thấy bao nhiêu cửa sổ? Tôi thấy sáu cái.", emoji: "🪟", choices: ["six", "five", "seven", "ten"] }
    ];

    let currentAdjObj = null;

    function startEngAdjectivesGame(targetObj = null, isNav = false) {
      currentMode = 'engAdjectives';
      updateBreadcrumbs([
        { label: '⬅️ Main Menu', action: 'openEngMenu()' },
        { label: '🔢 12. Numbers 1-10', action: 'startEngAdjectivesGame()' }
      ]);

      const historyState = getHistoryState('adjGame');
      let q;
      if (targetObj) {
        q = targetObj;
      } else if (historyState.index >= 0 && historyState.index < historyState.items.length - 1 && isNav) {
        historyState.index++;
        q = historyState.items[historyState.index];
      } else {
        q = getNextItemFromPool('pool_adjGame', ENG_ADJECTIVES_GRAMMAR);
        historyState.items.push(q);
        historyState.index = historyState.items.length - 1;
      }

      currentAdjObj = q;
      currentAnswer = q.correct;
      let choices = [...q.choices].sort(() => Math.random() - 0.5);

      container.innerHTML = `
        <div class="text-base md:text-lg font-black text-gray-800 mb-2 flex items-center justify-center gap-2">
          <span>Choose the correct number:</span>
          <button class="btn-bounce bg-orange-100 hover:bg-orange-200 text-orange-700 text-xs font-bold px-2.5 py-1 rounded-lg flex items-center gap-1 shadow-sm cursor-pointer" onclick="speakClear('${q.sentence.replace('______', q.correct).replace(/'/g, "\\'")}', 'en')">🔊 Listen</button>
        </div>

        <div class="bg-orange-50/50 border-2 border-dashed border-orange-300 rounded-2xl p-4 w-full max-w-xl mb-3.5 flex flex-col items-center shadow-sm">
          <div class="text-5xl mb-1.5">${q.emoji}</div>
          <div class="text-base md:text-lg font-black text-gray-800 mb-1.5">${q.sentence}</div>
          <div class="text-sm font-bold text-gray-500">Meaning: <b class="text-orange-700">${q.meaning}</b></div>
          <div id="adj-feedback" class="text-sm font-black min-h-[22px] mt-1.5"></div>
        </div>

        <div id="adj-choices-grid" class="grid grid-cols-2 sm:grid-cols-4 gap-3 w-full max-w-lg mb-3.5">
          ${choices.map(c => `<button class="btn-bounce bg-white border-3 border-orange-400 hover:bg-orange-50 text-orange-900 font-black py-2.5 px-2 rounded-xl shadow-sm transition cursor-pointer flex flex-col items-center justify-center" onclick="checkAdjChoice(this, '${c}')"><span class="text-sm md:text-base">${c}</span><span class="choice-ipa text-emerald-600 text-sm mt-1">${getIPA(c)}</span></button>`).join('')}
        </div>

        <div class="flex items-center justify-center space-x-3">
          <button onclick="prevAdjGame()" class="btn-bounce bg-sky-50 hover:bg-sky-100 text-sky-600 border-2 border-sky-300 font-black text-sm px-5 py-2 rounded-xl shadow-sm flex items-center space-x-1.5 cursor-pointer ${historyState.index <= 0 ? 'opacity-40 cursor-not-allowed' : ''}" ${historyState.index <= 0 ? 'disabled' : ''}>
            <i class="fa-solid fa-arrow-left"></i>
            <span>Previous</span>
          </button>
          <button onclick="nextAdjGame()" class="btn-bounce bg-amber-400 hover:bg-amber-500 text-amber-900 border-2 border-amber-500 font-black text-sm px-6 py-2 rounded-xl shadow-md flex items-center space-x-1.5 cursor-pointer">
            <span>Next</span>
            <i class="fa-solid fa-arrow-right"></i>
          </button>
        </div>
      `;
    }

    function checkAdjChoice(btnElement, selectedWord) {
      const feedback = document.getElementById('adj-feedback');
      speakClear(selectedWord, "en");

      if (selectedWord === currentAdjObj.correct) {
        btnElement.classList.add('!bg-emerald-500', '!text-white', '!border-emerald-600');
        playTone('correct');
        addStars(2, true);
        document.querySelectorAll('#adj-choices-grid button').forEach(b => b.disabled = true);
        feedback.innerHTML = `<span class="text-green-600 text-base font-black">🎉 Correct! (+2 ⭐). Press Next when ready!</span>`;
        speakClear(currentAdjObj.sentence.replace('______', currentAdjObj.correct), "en");
      } else {
        btnElement.classList.add('!bg-rose-500', '!text-white', '!border-rose-600');
        playTone('wrong');
        feedback.innerHTML = `<span class="text-rose-600 text-sm font-bold">💡 Try again! "${selectedWord}" is not correct.</span>`;
        setTimeout(() => {
          btnElement.classList.remove('!bg-rose-500', '!text-white', '!border-rose-600');
        }, 1000);
      }
    }

    function prevAdjGame() {
      const historyState = getHistoryState('adjGame');
      if (historyState.index > 0) {
        historyState.index--;
        startEngAdjectivesGame(historyState.items[historyState.index], true);
      }
    }

    function nextAdjGame() {
      const historyState = getHistoryState('adjGame');
      if (historyState.index < historyState.items.length - 1) {
        historyState.index++;
        startEngAdjectivesGame(historyState.items[historyState.index], true);
      } else {
        startEngAdjectivesGame(null, false);
      }
    }

    /* =========================================================================
       19. GENERIC CHOICE CHECKER (used by Alphabet Quiz & IPA Quiz)
       ========================================================================= */
    function checkChoiceAnswer(btnElement, selectedAnswer) {
      let feedbackId = 'quiz-feedback';
      let gridId = 'alpha-choices-grid';
      if (currentMode === 'engIPAQuiz') {
        feedbackId = 'ipa-quiz-feedback';
        gridId = 'ipa-choices-grid';
      }
      const feedback = document.getElementById(feedbackId);
      speakClear(selectedAnswer, "en");

      if (selectedAnswer === currentAnswer) {
        btnElement.classList.add('!bg-emerald-500', '!text-white', '!border-emerald-600');
        playTone('correct');
        addStars(2, true);
        document.querySelectorAll(`#${gridId} button`).forEach(b => b.disabled = true);
        if (feedback) feedback.innerHTML = `<span class="text-green-600 text-base font-black">🎉 Correct! (+2 ⭐). Press Next when ready!</span>`;
      } else {
        btnElement.classList.add('!bg-rose-500', '!text-white', '!border-rose-600');
        playTone('wrong');
        if (feedback) feedback.innerHTML = `<span class="text-rose-600 text-sm font-bold">💡 Try again!</span>`;
        setTimeout(() => {
          btnElement.classList.remove('!bg-rose-500', '!text-white', '!border-rose-600');
        }, 1000);
      }
    }

    /* =========================================================================
       20. APP INITIALIZATION
       ========================================================================= */
    document.addEventListener('DOMContentLoaded', function () {
      // Overlay/start button already handles first launch via initAppAudio().
    });
  </script>
</body>
</html>
