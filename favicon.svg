<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe3f1"/>
      <stop offset="100%" stop-color="#ffc4e0"/>
    </linearGradient>
  </defs>

  <!-- Nen bo goc -->
  <rect x="0" y="0" width="512" height="512" rx="120" fill="url(#bg)"/>

  <g transform="translate(256,256)">
    <!-- TAI trai -->
    <g transform="rotate(-12)">
      <rect x="-108" y="-208" width="60" height="180" rx="30" fill="#ffffff" stroke="#ff8fbf" stroke-width="8"/>
      <rect x="-96" y="-192" width="36" height="150" rx="18" fill="#ffb3d4"/>
    </g>
    <!-- TAI phai -->
    <g transform="rotate(12)">
      <rect x="48" y="-208" width="60" height="180" rx="30" fill="#ffffff" stroke="#ff8fbf" stroke-width="8"/>
      <rect x="60" y="-192" width="36" height="150" rx="18" fill="#ffb3d4"/>
    </g>

    <!-- DAU -->
    <circle cx="0" cy="-24" r="132" fill="#ffffff" stroke="#ff8fbf" stroke-width="8"/>

    <!-- Ma hong -->
    <circle cx="-78" cy="10" r="26" fill="#ffb3d4"/>
    <circle cx="78" cy="10" r="26" fill="#ffb3d4"/>

    <!-- Mat trai -->
    <circle cx="-48" cy="-30" r="20" fill="#3a2a33"/>
    <circle cx="-41" cy="-37" r="7" fill="#ffffff"/>
    <!-- Mat phai -->
    <circle cx="48" cy="-30" r="20" fill="#3a2a33"/>
    <circle cx="55" cy="-37" r="7" fill="#ffffff"/>

    <!-- Long mi trai -->
    <path d="M-70,-46 l-14,-8" stroke="#3a2a33" stroke-width="6" stroke-linecap="round"/>
    <path d="M-70,-34 l-16,-1" stroke="#3a2a33" stroke-width="6" stroke-linecap="round"/>
    <!-- Long mi phai -->
    <path d="M70,-46 l14,-8" stroke="#3a2a33" stroke-width="6" stroke-linecap="round"/>
    <path d="M70,-34 l16,-1" stroke="#3a2a33" stroke-width="6" stroke-linecap="round"/>

    <!-- Mui -->
    <path d="M0,6 l-12,-11 a12,9 0 0 1 24,0 Z" fill="#ff5f9e"/>
    <!-- Mieng -->
    <path d="M0,10 C-6,24 -22,22 -26,10" fill="none" stroke="#ff8fbf" stroke-width="6" stroke-linecap="round"/>
    <path d="M0,10 C6,24 22,22 26,10" fill="none" stroke="#ff8fbf" stroke-width="6" stroke-linecap="round"/>

    <!-- No hong tren dau (lech phai) -->
    <g transform="translate(70,-150)">
      <path d="M0,0 C-30,-22 -54,-16 -54,8 C-54,30 -30,30 0,8 Z" fill="#ff6fa8" stroke="#e14b8a" stroke-width="6"/>
      <path d="M0,0 C30,-22 54,-16 54,8 C54,30 30,30 0,8 Z" fill="#ff6fa8" stroke="#e14b8a" stroke-width="6"/>
      <circle cx="0" cy="4" r="14" fill="#ff9ec4" stroke="#e14b8a" stroke-width="6"/>
    </g>
  </g>
</svg>
